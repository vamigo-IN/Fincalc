# fincalc.vamigo.in -> the FinCalc API on 127.0.0.1:8087
#
#   sudo cp this to /etc/nginx/sites-available/fincalc
#   sudo ln -s /etc/nginx/sites-available/fincalc /etc/nginx/sites-enabled/fincalc
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fincalc.vamigo.in
#
# Written as HTTP-only ON PURPOSE. certbot needs to answer a challenge on :80
# before a certificate exists, and it rewrites this file afterwards to add the
# TLS server block and the :80 redirect — the same "managed by Certbot" lines
# already in the vamigo site. Pasting a TLS block referencing a certificate that
# does not exist yet makes `nginx -t` fail and blocks issuance.
#
# A SEPARATE FILE, not an addition to the vamigo site: this is a different
# application on a different upstream, and keeping it separate means a certbot
# rewrite here can never touch the block serving the main site.

server {
    listen      80;
    listen [::]:80;
    server_name fincalc.vamigo.in;

    server_tokens off;

    # The API caps bodies at 256kb (BODY_LIMIT). Matching it here means an
    # oversized request is rejected by the API with a readable error rather than
    # by nginx with a bare 413. Deliberately NOT the vamigo site's 12M — nothing
    # here accepts uploads, and a larger cap is only a larger thing to absorb.
    client_max_body_size 256k;

    # No security headers here. The API sends its own via helmet, and nginx
    # passes upstream headers through untouched — the same reasoning as the
    # vamigo block. Two sources for one header is how they end up contradicting.

    location / {
        proxy_pass         http://127.0.0.1:8087;
        proxy_http_version 1.1;

        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # =====================================================================
        # $remote_addr, NOT $proxy_add_x_forwarded_for.
        #
        # $proxy_add_x_forwarded_for expands to "$http_x_forwarded_for,
        # $remote_addr" — it APPENDS to whatever the client sent, so the client
        # controls everything before the last entry.
        #
        # Express runs with `trust proxy = 1` and reads the rightmost entry, so
        # the appending form would in fact still yield the real address here.
        # $remote_addr is used anyway because it is the real TCP peer and there
        # is nothing to reason about: no forged prefix ever enters the header,
        # so no future change to the trust setting can turn a header the client
        # wrote into an identity the server believes.
        #
        # This matters. The value keys the auth rate limiter (10 requests per
        # window) and the audit log's IP prefix. Get it wrong and every attacker
        # request looks like a new client, which is a brute-force allowance
        # rather than a limit.
        # =====================================================================
        proxy_set_header X-Forwarded-For $remote_addr;

        # Without this the API believes it is on http and emits http:// URLs.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # No Upgrade/Connection headers: this API opens no WebSocket.

        # Longer than the API's own REQUEST_TIMEOUT_MS (15s) so the API decides
        # when a request has taken too long and can say why, rather than nginx
        # cutting it off first with a 504 that explains nothing.
        proxy_read_timeout 30s;

        # Responses are small JSON. Buffering is fine and is the default; unlike
        # the Next.js site there is no streamed RSC payload to hold up.
    }
}
