# Development overrides — auto-loaded by `docker compose up`.
# NEVER deployed. Production uses `-f docker-compose.yml -f compose.prod.yml`,
# which publishes nothing for the datastores.
#
# WHY THIS FILE EXISTS: `fincalc_net` is `internal: true`, and Docker cannot
# publish a host port for a container attached ONLY to an internal network — the
# `ports:` entry is silently ignored. So to reach Postgres/Redis from the host
# with psql or redis-cli during development, they must also join a routable
# network. Attaching `fincalc_edge` here keeps the production topology honest
# (data services isolated) while making local work possible.
#
# Host ports remain 5442 / 6389 — never the VPS's occupied 5432/5433/6379.

services:
  fincalc_postgres:
    networks: [fincalc_net, fincalc_edge]

  fincalc_redis:
    networks: [fincalc_net, fincalc_edge]

  fincalc_api:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
