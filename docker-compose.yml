# FinCalc 2.0 — local / VPS Compose stack.
#
# PORT DISCIPLINE. The VPS already runs other Docker projects. These host ports
# are OCCUPIED and must never be published by this stack:
#     5432, 5433  (postgres)   3000, 3050, 5050  (apps)   6379, 5678  (redis, n8n)
# Ours, verified free:
#     5442  postgres      6389  redis      8087  api
# src/config.ts enforces the blocklist at boot, so a careless edit here fails
# fast with a readable message instead of colliding with a neighbour's service.
#
# In production, Postgres and Redis publish NOTHING (see compose.prod.yml) and the
# API binds to loopback only, behind the host's existing reverse proxy.

name: fincalc

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ONE environment, shared by fincalc_api and fincalc_migrate.
#
# They run the same image and the seed imports src/config.ts, which validates
# the WHOLE environment and exits on anything missing — so the migration job
# needs every variable the API needs, even the ones it never uses.
#
# This was two separate blocks, and migrate had only DATABASE_URL. It worked
# until the seed learned to create the admin account, which pulled in config;
# after that every production-required variable was a fresh way for the deploy
# to fail with `exit 1` after the migration had already applied. An anchor makes
# drift impossible: a variable added for the API is automatically present here.
#
# There is no .env inside the image (.dockerignore excludes it), so nothing is
# filled in implicitly. Absent here means absent.
x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://fincalc_owner:${POSTGRES_PASSWORD:-fincalc_dev_only}@fincalc_postgres:5432/fincalc?schema=public
  REDIS_URL: redis://fincalc_redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-}
  EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY:-}
  # `:?` fails fast with a readable message instead of starting a container that
  # exits a second later.
  PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER in .env}
  AUDIT_PEPPER: ${AUDIT_PEPPER:?set AUDIT_PEPPER in .env}
  JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:?set JWT_SIGNING_KEYS in .env — see DEPLOY.md}
  JWT_CURRENT_KID: ${JWT_CURRENT_KID:-}
  JWT_ISSUER: ${JWT_ISSUER:-}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  # Reset a SPECIFIC admin with scripts/reset-admin.js; defaults to the first
  # ADMIN_EMAILS entry when unset.
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}

  # Everything below is `${VAR:-}` — empty when unset, which config.ts strips so
  # the default in the Zod schema applies. Defaults are NOT repeated here on
  # purpose: two copies drift, and then the running value stops matching the
  # documented one.
  #
  # These were absent entirely, so setting any of them in .env did nothing under
  # Docker — the file advertised tunables the container never received.
  BCRYPT_COST: ${BCRYPT_COST:-}
  RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-}
  RATE_LIMIT_WRITE_MAX: ${RATE_LIMIT_WRITE_MAX:-}
  ACCESS_TOKEN_TTL_S: ${ACCESS_TOKEN_TTL_S:-}
  REFRESH_TOKEN_TTL_S: ${REFRESH_TOKEN_TTL_S:-}
  MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER:-}
  FREE_TIER_GOAL_LIMIT: ${FREE_TIER_GOAL_LIMIT:-}
  FX_BASE_CURRENCY: ${FX_BASE_CURRENCY:-}
  FX_FRESH_MINUTES: ${FX_FRESH_MINUTES:-}
  REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-}
  BODY_LIMIT: ${BODY_LIMIT:-}

services:
  fincalc_postgres:
    image: postgres:17.5-bookworm
    container_name: fincalc_postgres
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: fincalc
      POSTGRES_USER: fincalc_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fincalc_dev_only}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: UTC
    # Sized for a SMALL box by default — 1 vCPU, ~2GB, shared with whatever else
    # the host already runs. The original values (384MB buffers, 1GB cache,
    # 100 connections) assumed a 4-vCPU machine this stack does not have.
    #
    # On a bigger host, raise these in .env rather than editing here:
    #   PG_SHARED_BUFFERS=384MB PG_EFFECTIVE_CACHE=1GB PG_MAX_CONNECTIONS=100
    #
    # shared_buffers wants roughly a quarter of what Postgres is allowed, and
    # effective_cache_size is only an ESTIMATE of the OS page cache — it
    # allocates nothing, but setting it above what the machine has makes the
    # planner choose index scans that then hit disk.
    command: >
      postgres
        -c shared_buffers=${PG_SHARED_BUFFERS:-160MB}
        -c effective_cache_size=${PG_EFFECTIVE_CACHE:-384MB}
        -c work_mem=${PG_WORK_MEM:-4MB}
        -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
        -c max_connections=${PG_MAX_CONNECTIONS:-50}
        -c log_min_duration_statement=500
        -c log_checkpoints=on
        -c log_lock_waits=on
        -c track_io_timing=on
        -c shared_preload_libraries=pg_stat_statements
    ports:
      # host 5442 -> container 5432. Dev only; removed in compose.prod.yml.
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincalc_owner -d fincalc"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [fincalc_net]
    deploy:
      resources:
        # CPUS MUST NOT EXCEED THE HOST'S CORE COUNT. Docker refuses to create
        # the container otherwise — "range of CPUs is from 0.01 to 1.00, as
        # there are only 1 CPUs available" — and the whole stack fails to come
        # up. This was 1.5, which is invalid on any single-core host.
        #
        # These are CEILINGS, not reservations, so they may safely sum to more
        # than the host has: each says "no more than this", not "set this
        # aside". On one core, leaving a little headroom below 1.0 keeps the
        # API responsive while a long query runs.
        limits:
          cpus: "${PG_CPUS:-0.7}"
          memory: ${PG_MEMORY:-640M}

  fincalc_redis:
    image: redis:7.4-alpine
    container_name: fincalc_redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
        --maxmemory ${REDIS_MAXMEMORY:-96mb}
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
        --save ""
    ports:
      # host 6389 -> container 6379. Dev only.
      - "127.0.0.1:6389:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [fincalc_net]
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-0.3}"
          memory: ${REDIS_MEMORY:-160M}

  # One-shot: runs migrations to completion, then exits. fincalc_api waits on it
  # so N replicas can never race Prisma's advisory lock (docs 08 §5).
  # Shares fincalc_api's image, different command (docs 08 §5). It must NOT have
  # its own `build:` block — Compose would then build a SECOND image under a
  # different name, and `docker compose build fincalc_api` would silently leave
  # this one stale.
  fincalc_migrate:
    image: fincalc-api:local
    container_name: fincalc_migrate
    restart: "no"
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js"]
    environment: *api-env
    depends_on:
      fincalc_postgres: { condition: service_healthy }
      # Not because the seed uses Redis, but because config demands a valid
      # REDIS_URL and the API waits on this container: starting the migration
      # before Redis is up only moves the failure later.
      fincalc_redis: { condition: service_healthy }
    networks: [fincalc_net]

  fincalc_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fincalc-api:local          # one image, reused by fincalc_migrate
    container_name: fincalc_api
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *api-env
      PORT: 8087
    ports:
      # Loopback only. The host's existing reverse proxy fronts this (docs 09 §2).
      - "127.0.0.1:8087:8087"
    depends_on:
      fincalc_postgres: { condition: service_healthy }
      fincalc_redis: { condition: service_healthy }
      fincalc_migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8087/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks: [fincalc_net, fincalc_edge]
    deploy:
      resources:
        limits:
          # 0.9 rather than 1.0 on a single-core host: leaving a sliver keeps
          # the machine responsive enough to SSH in when the API is saturated.
          cpus: "${API_CPUS:-0.9}"
          memory: ${API_MEMORY:-384M}

networks:
  # Data services live here and have NO route to the internet.
  fincalc_net:
    name: fincalc_net
    internal: true
  # The API needs egress (exchangerate-api, Play API, FCM), so it joins both.
  fincalc_edge:
    name: fincalc_edge

volumes:
  pgdata:
    name: fincalc_pgdata
  redisdata:
    name: fincalc_redisdata
